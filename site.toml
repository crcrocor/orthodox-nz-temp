# Every page of the site. Kinds:
#   mirror — regenerated from orthodox.net.nz by scripts/mirror.py (edit the old site or scripts/corrections.py)
#   frozen — seeded once by the mirror, then edited by hand in content/pages/ (the mirror never overwrites it)
#   local  — written by hand in content/pages/
# `source` is the page's path on orthodox.net.nz; `h1` overrides the heading taken from the old <title>;
# `lang` overrides the language detected from the text; `aliases` are extra old paths with the same page.
# Articles under article/ are mirror pages found through the links on about_orthodoxy.html.

[site]
