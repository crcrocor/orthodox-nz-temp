description = "Новозеландское благочиние Русской Зарубежной Церкви, Австралийско-Новозеландская епархия."
skip = "Перейти к содержанию"
menu = "Меню"
switch = "English"
footer_published = "Сайт ведёт благотворительный траст"
footer_charity = "номер в реестре благотворительных организаций"
other_language_note = "Эта страница есть только на английском языке."
not_found_title = "Страница не найдена"
not_found_text = "Такой страницы нет. Начните, пожалуйста, с"
not_found_link = "главной страницы"

