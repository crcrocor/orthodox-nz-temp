# The site: interface strings in both languages, the menu, the footer and every page.
#
# Languages: English is the default and lives at the old paths; Russian lives under ru/ with the same
# paths. A page with a hand-written Russian version has it in content/pages/ru/<path>; every other page
# (the mirrored ones, bilingual as on the old site) is shown with the same content in both versions and
# only the interface changes. Links inside page bodies are always written as seen from the English page.
#
# Page kinds:
#   mirror — regenerated from orthodox.net.nz by scripts/mirror.py (edit the old site or scripts/corrections.py)
#   frozen — seeded once by the mirror, then edited by hand in content/pages/ (the mirror never overwrites it)
#   local  — written by hand in content/pages/
# A menu item has either `path` (a page of this site) or `url` (another site).
# `source` is the page's path on orthodox.net.nz; `h1` overrides the heading taken from the old <title>
# (applied by the mirror); `h1_ru` is the heading of the Russian version of a shared page; `description`
# and `description_ru` override the default meta description; `note_en` / `note_ru` replace the general
# note on a page that exists in one language only.
# Articles under article/ are mirror pages found through the links on about_orthodoxy.html.

[site]
legal_name = "Church of the Resurrection of Christ Russian Orthodox Church Abroad Trust"
charity_number = "CC42458"
register_url = "https://register.charities.govt.nz/Charity/CC42458"
old_site = "https://orthodox.net.nz"

[ui.en]
name = "New Zealand Deanery"
name_line2 = "of the Russian Orthodox Church Outside of Russia"
title_suffix = "New Zealand Deanery of ROCOR"
description = "New Zealand Deanery of the Russian Orthodox Church Outside of Russia (ROCOR), Australian and New Zealand Diocese."
skip = "Skip to content"
menu = "Menu"
switch = "Русский"
footer_published = "This website is published by the"
footer_charity = "registered charity"
other_language_note = "This page is available in Russian only."
not_found_title = "Page not found"
not_found_text = "This page does not exist. Please start from the"
not_found_link = "home page"

[ui.ru]
name = "Новозеландское благочиние"
name_line2 = "Русской Зарубежной Церкви"
